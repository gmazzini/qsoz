      out.innerHTML = await r.text();
    });
  }
  else if (/^a\d{2}$/.test(btn.id)) {
    btn.addEventListener("click", async () => {
      const num = parseInt(btn.id.slice(1), 10);
      if (num == 1 || num == 6 || num == 28) base = 0;
      else if (num == 2 || num == 7 || num == 29) base -= mypage;
      else if (num == 3 || num == 8 || num == 30) base += mypage;
      let data = "";
      if (num >= 15 && num <= 22) {
        const file = document.getElementById("ff").files[0];
        if (file) {
          const plainStream = file.stream();
          const plainBlob = await new Response(plainStream).blob();
          const buf = await plainBlob.arrayBuffer();
          let chunk = 0x8000, bytes = new Uint8Array(buf);
          let binary = "";
          for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
          }
          data = btoa(binary);
        }
      }
      if (num >= 9 && num <= 22) document.getElementById("out2").textContent = "Waiting";
      else document.getElementById("out").textContent = "Waiting";
      if (base < 0) base = 0;
      document.getElementById("base").textContent = base;

        ota,
        btn.id,
        base,
        mypage,
        ...inputs.map(id => document.getElementById(id)?.value.trim() || "-"),
        num === 13 ? v.slice(9, 22).join('') : num === 26 ? start : '',
        data
      ].join(",");

        method: "POST", cache: "no-store", credentials: "same-origin",
        headers: {"Content-Type": "text/csv"},
        body
      });
      let out = null;
      if (num == 5) {

      else {
        const html = await r.text();

        else out = document.getElementById("out");

      if (num == 23) {
        const match = out.innerText.match(/Start:\s*(.+)/);
        if (match) start = match[1].trim();
        else start = "";
      }
      else if (num == 26) {
        start = "";
        if (v[22] === 1) document.getElementById("contx").value = parseInt(document.getElementById("contx").value) + 1;

      else if (num == 14) {

  else if (btn.id === "l03") {

        document.getElementById("mypage").value = mypage;
        for (let i = 0; i < 13; i++) v[9 + i] = +filter[i];
        setchecks();
      }
    });
  }
  else if (/^b\d{2}$/.test(btn.id)) {
    btn.addEventListener("click", async () => {
      const num = parseInt(btn.id.slice(1), 10);
      switch (num) {
        case 1:
          v[1] = 1 - v[1];
          if (v[1] === 1) {
            document.getElementById("freq").disabled = true;
            document.getElementById("mode").disabled = true;
          } 
          else {
            document.getElementById("freq").disabled = false;
            document.getElementById("mode").disabled = false;
          }
          break;
        case 2:
          b02f = document.getElementById("freq").value;
          b02m = document.getElementById("mode").value;
          document.getElementById("c23").textContent = b02f + ":" + b02m;
          break;
        case 3:
          if (v[1] === 1 && typeof b02f !== "undefined" && typeof b02m !== "undefined") {
            document.getElementById("freq").value = b02f;
            document.getElementById("mode").value = b02m;
            radioset(b02f,b02m);
          }
          break;
        case 4:
          b04f = document.getElementById("freq").value;
          b04m = document.getElementById("mode").value;
          document.getElementById("c45").textContent = b04f + ":" + b04m;
          break;
        case 5:
          if (v[1] === 1 && typeof b04f !== "undefined" && typeof b04m !== "undefined") {
            document.getElementById("freq").value = b04f;
            document.getElementById("mode").value = b04m;
            radioset(b04f,b04m);

          break;
        case 6:
          b06f = document.getElementById("freq").value;
          b06m = document.getElementById("mode").value;
          document.getElementById("c67").textContent = b06f + ":" + b06m;
          break;
        case 7:

            document.getElementById("freq").value = b06f;
            document.getElementById("mode").value = b06m;

            document.getElementById("contx").disabled = false;
            document.getElementById("conrx").disabled = false;
          }
          else {
            document.getElementById("contest").disabled = true;
            document.getElementById("contx").disabled = true;
            document.getElementById("conrx").disabled = true;
          }
          break;
        default:
          v[num] = 1 - v[num];
          break;
      }
      setchecks();
    });

  else  if (/^t.*/.test(btn.id)) {
    btn.addEventListener("click", async (t) => {
      document.getElementById("sigtx").value = t.currentTarget.id.slice(1);

  else  if (/^r.*/.test(btn.id)) {
    btn.addEventListener("click", async (r) => {
      document.getElementById("sigrx").value = r.currentTarget.id.slice(1);
    });

window.timeupdate = async () => {
  mysync++;
  if (mysync == 60){
    mysync = 0;
    const r = await fetch("ptime.cgi");
    const t = await r.text();
    delta = Number(t) - Math.floor(Date.now() / 1000);
  }
  const d = new Date(Date.now() + delta * 1000);
  const YYYY = d.getUTCFullYear();
  const MM = String(d.getUTCMonth() + 1).padStart(2, '0');
  const DD = String(d.getUTCDate()).padStart(2, '0');
  const hHH = String(d.getUTCHours()).padStart(2, '0');
  const mm = String(d.getUTCMinutes()).padStart(2, '0');
  const ss = String(d.getUTCSeconds()).padStart(2, '0');
  document.getElementById("o_time").textContent = `${YYYY}-${MM}-${DD} ${hHH}:${mm}:${ss} UTC`;
}

const SVG_NS="http://www.w3.org/2000/svg";

function svgNode(name,attrs={},text="") {
  const el=document.createElementNS(SVG_NS,name);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  if(text)el.textContent=text;
  return el;
}

function chartTime(epochSec) {
  const d=new Date(epochSec*1000);
  const dd=String(d.getDate()).padStart(2,"0");
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${dd}-${hh}:${mm}`;
}

function drawChart(el,rows) {
  const width=Math.max(500,el.clientWidth||500);
  const height=Math.max(300,el.clientHeight||520);
  const left=58,right=72,top=22,bottom=52;
  const pw=width-left-right,ph=height-top-bottom;
  const svg=svgNode("svg",{viewBox:`0 0 ${width} ${height}`,width:"100%",height:"100%","aria-label":"Contest activity chart",role:"img"});
  let maxLeft=1,maxScore=1;

  rows.forEach(r=>{
    maxLeft=Math.max(maxLeft,Number(r[1])||0,Number(r[2])||0,Number(r[3])||0);
    maxScore=Math.max(maxScore,Number(r[4])||0);
  });
  const x=i=>left+(rows.length<=1?pw/2:(i*pw/(rows.length-1)));
  const yLeft=v=>top+ph-(Number(v)||0)*ph/maxLeft;
  const yScore=v=>top+ph-(Number(v)||0)*ph/maxScore;

  for(let i=0;i<=5;i++){
    const y=top+ph*i/5;
    const lv=Math.round(maxLeft*(5-i)/5);
    const rv=Math.round(maxScore*(5-i)/5);
    svg.appendChild(svgNode("line",{x1:left,y1:y,x2:left+pw,y2:y,class:"chart-grid"}));
    svg.appendChild(svgNode("text",{x:left-8,y:y+4,"text-anchor":"end",class:"chart-label"},String(lv)));
    svg.appendChild(svgNode("text",{x:left+pw+8,y:y+4,"text-anchor":"start",class:"chart-label"},String(rv)));
  }
  svg.appendChild(svgNode("line",{x1:left,y1:top,x2:left,y2:top+ph,class:"chart-axis"}));
  svg.appendChild(svgNode("line",{x1:left+pw,y1:top,x2:left+pw,y2:top+ph,class:"chart-axis"}));
  svg.appendChild(svgNode("line",{x1:left,y1:top+ph,x2:left+pw,y2:top+ph,class:"chart-axis"}));

  const ticks=Math.min(8,rows.length);
  for(let i=0;i<ticks;i++){
    const idx=ticks<=1?0:Math.round(i*(rows.length-1)/(ticks-1));
    const xx=x(idx);
    svg.appendChild(svgNode("line",{x1:xx,y1:top+ph,x2:xx,y2:top+ph+5,class:"chart-axis"}));
    svg.appendChild(svgNode("text",{x:xx,y:top+ph+20,"text-anchor":"middle",class:"chart-label"},chartTime(rows[idx][0])));
  }

  const defs=[
    [1,yLeft,"QSO","chart-series chart-qso"],
    [2,yLeft,"Points","chart-series chart-points"],
    [3,yLeft,"Mults","chart-series chart-mults"],
    [4,yScore,"Score","chart-series chart-score"]
  ];
  defs.forEach(def=>{
    const points=rows.map((r,i)=>`${x(i)},${def[1](r[def[0]])}`).join(" ");
    if(points)svg.appendChild(svgNode("polyline",{points,class:def[3]}));
  });

  let lx=left;
  defs.forEach(def=>{
    svg.appendChild(svgNode("line",{x1:lx,y1:height-14,x2:lx+22,y2:height-14,class:def[3]}));
    svg.appendChild(svgNode("text",{x:lx+28,y:height-10,class:"chart-label"},def[2]));
    lx+=92;
  });
  svg.appendChild(svgNode("text",{x:14,y:top+ph/2,transform:`rotate(-90 14 ${top+ph/2})`,"text-anchor":"middle",class:"chart-label"},"QSO / Points / Mults"));
  svg.appendChild(svgNode("text",{x:width-12,y:top+ph/2,transform:`rotate(90 ${width-12} ${top+ph/2})`,"text-anchor":"middle",class:"chart-label"},"Score"));
  el.replaceChildren(svg);
}

function renderCharts(root=document) {
  root.querySelectorAll(".gchart").forEach(el=>{
    let rows;
    try { rows=JSON.parse(el.dataset.rows); }
    catch { el.textContent="Invalid chart data"; return; }
    if(!Array.isArray(rows) || rows.length===0){el.textContent="No chart data"; return;}
    const draw=()=>drawChart(el,rows);
    draw();
    if(!el._qsozResizeObserver){
      el._qsozResizeObserver=new ResizeObserver(draw);
      el._qsozResizeObserver.observe(el);
    }
  });
}

window.openImgExact = (url) => {
  const win = window.open("", "img", "width=200,height=200,resizable=1,scrollbars=0");
  if (!win) return false;
  win.document.title = "Image";
  const style = win.document.createElement("style");
  style.textContent = "html,body{margin:0;padding:0;overflow:hidden} img{display:block}";
  const im = win.document.createElement("img");
  im.id = "i";
  im.src = url;
  win.document.head.replaceChildren(style);
  win.document.body.replaceChildren(im);
  im.onload = () => {
    const w = im.naturalWidth;
    const h = im.naturalHeight;
    const fit = () => win.resizeTo(
      win.outerWidth + (w - win.innerWidth),
      win.outerHeight + (h - win.innerHeight)
    );
    fit();
    requestAnimationFrame(fit);
    setTimeout(fit, 50);
  };
  return false;
};
  
</script>
